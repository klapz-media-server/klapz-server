	"""
	Not an e-mail address.
	"""
	INVALID_EMAIL
	"""
	Shorter than 8 characters, or longer than 256.
	"""
	WEAK_PASSWORD
	"""
	The address already has a user.
	"""
	EMAIL_TAKEN
	"""
	No user with this address and this password. Worded the same for both, so a stranger

"""
Anything that can be refetched by its global identifier.

Relay's object identification contract. Every object with an identity implements it:
"some objects are refetchable and some are not" is harder to explain than "all of them
are", and a uniform rule costs only a routing arm per type.
"""
interface Node {
	"""
	Globally unique, opaque identifier.
	"""
	id: ID!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

"""
What pairing a connection with an account takes.
"""
input PairExtensionInput {
	"""
	The user, as returned in `User.id`. It must already be connected through the extension.
	"""
	userId: ID!
	"""
	The protocol to pair.
	"""
	extension: ExtensionType!
	"""
	The single-use code the account's owner got from the service: for Plex, from
	plex.tv/claim.
	"""
	code: String!
	"""
	Where clients can reach this server, as `https://host:port`.
	"""
	connectionUri: String!
}

type Person implements Node {
	"""
	Globally unique, opaque identifier. Pass it to `node` to refetch this person.
	"""
	id: ID!
	"""
	The person's name. Not unique: two people can share one, and `providerKey` is what
	tells them apart.
	"""
	name: String!
	"""
	The metadata provider's identifier for this person. Null for the people the provider
	does not know.
	"""
	providerKey: String
	"""
	A portrait, hosted by the metadata provider.
	"""
	thumbUrl: String
}

type PlayQueue implements Node {
	"""
	Globally unique, opaque identifier. Pass it to `node` to refetch this queue.
	"""
	id: ID!
	"""
	Where the items came from, as the client named it.
	"""
	sourceUri: String!
	"""
	Whether the entries are in random order.
	"""
	shuffled: Boolean!
	"""
	Raised each time the queue changes.
	"""
	version: Int!
	"""
	How many entries the queue holds.
	"""
	totalCount: Int!
	"""
	The entry to play first. Null for an empty queue.
	"""
	selectedEntry: PlayQueueEntry
	"""
	The entries, in play order.
	"""
	entries(
		"""
		Return entries after this cursor.
		"""
		after: String,
		"""
		Return entries before this cursor.
		"""
		before: String,
		"""
		Return at most this many entries from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many entries from the end of the range.
		"""
		last: Int,
		"""
		Skip this many entries first, to land in the middle of the queue.
		"""
		offset: Int
	): PlayQueueEntryConnection!
}

type PlayQueueEntry implements Node {
	"""
	Globally unique, opaque identifier. Pass it to `node` to refetch this entry.
	"""
	id: ID!
	"""
	The queue this entry belongs to, as returned in `PlayQueue.id`.
	"""
	queueId: ID!
	"""
	Its place in the queue, from zero.
	"""
	position: Int!
	"""
	What it plays. Null if the item has left the library since.
	"""
	item: Item
}

type PlayQueueEntryConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [PlayQueueEntryEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [PlayQueueEntry!]!
}

"""
An edge in a connection.
"""
type PlayQueueEntryEdge {
	"""
	The item at the end of the edge
	"""
	node: PlayQueueEntry!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type PlaybackSession implements Node {
	"""
	Globally unique, opaque identifier. Pass it to `node` to refetch this session.
	"""
	id: ID!
	"""
	The identifier the client chose for this playback.
	"""
	key: String!
	"""
	The player's identifier for the whole playback, when it gave one. Unlike `key`, it
	stays the same when the quality changes.
	"""
	playbackId: String
	"""
	What is being played. Null if it has left the library since.
	"""
	item: Item
	"""
	Where playback stands.
	"""
	state: PlaybackStateType!
	"""
	What happens to the video track.
	"""
	videoDecision: StreamDecisionType!
	"""
	What happens to the audio track.
	"""
	audioDecision: StreamDecisionType!
	"""
	The client's stable identifier for itself, when it gave one.
	"""
	clientIdentifier: String
	"""
	The application playing, when it said: `Plex Web`.
	"""
	clientProduct: String
	"""
	Position in the item, in milliseconds.
	"""
	positionMs: Int!
	"""
	The bitrate of the video sent to the player, in bits per second, when known.
	"""
	videoBitrate: Int
	"""
	The bitrate of the audio sent to the player, in bits per second, when known.
	"""
	audioBitrate: Int
	"""
	The width of the picture sent to the player, when known.
	"""
	width: Int
	"""
	The height of the picture sent to the player, when known.
	"""
	height: Int
	"""
	When playback began, in seconds since the epoch.
	"""
	startedAt: Int!
	"""
	The last sign of life, in seconds since the epoch.
	"""
	updatedAt: Int!
	"""
	When the session goes away without a further sign of life, in seconds since the epoch.
	"""
	expiresAt: Int!
}

type PlaybackSessionConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [PlaybackSessionEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [PlaybackSession!]!
}

"""
An edge in a connection.
"""
type PlaybackSessionEdge {
	"""
	The item at the end of the edge
	"""
	node: PlaybackSession!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
How far along a playback is, as the player last reported it.
"""
enum PlaybackStateType {
	"""
	The picture is moving.
	"""
	PLAYING
	"""
	The player is holding still.
	"""
	PAUSED
	"""
	The player is waiting for data.
	"""
	BUFFERING
}

type Query {
	"""
	Refetches any object by its global identifier.
	
	The single entry point Relay clients use to refresh cached objects. Returns null when
	nothing carries that identifier; a malformed identifier is an error rather than null,
	because it signals a client bug rather than a deleted object.
	"""
	node(
		"""
		A global identifier previously returned in an `id` field.
		"""
		id: ID!
	): Node
	"""
	Refetches several objects by their global identifiers, in the order given.
	
	The batched form of `node`. A client refreshing a screenful of cached objects would
	otherwise send one query per object, or an aliased query whose *text* grows with the
	request; here the count is a value. Entries are null where nothing carries that
	identifier, so positions line up with the input and a missing object does not shift
	the rest.
	
	Identifiers are deduplicated before loading, so repeating one costs nothing.
	"""
	nodes(
		"""
		Global identifiers previously returned in `id` fields.
		"""
		ids: [ID!]!
	): [Node]!
	"""
	What this server is and what it can do.
	
	The first thing a client should ask: it decides from the answer what to offer. Every
	optional feature reports as available, because there is no paid tier here.
	"""
	server: Server!
	"""
	Items whose title matches a search term, across every library.
	
	What the caller has started and what comes next, newest first: every film in
	progress, and for every series the episode in progress or the one after the last
	watched. Played within the last sixteen weeks; every copy of a work is listed.
	
	Empty for a caller with no watch state. Pages forward only, by position: the list is
	built whole from the caller's recent viewing, which is bounded by those sixteen weeks.
	"""
	continueWatching(
		"""
		Only this library's items, as returned in `Library.id`.
		"""
		library: ID,
		"""
		Return entries after this cursor.
		"""
		after: String,
		"""
		Return at most this many entries.
		"""
		first: Int
	): ContinueWatchingConnection!
	"""
	Matches a *word prefix*: `hell` finds "Good News About Hell", and accents are folded so
	`soiree` finds "# Pire Soirée". A term inside a word does not match — the index is a
	range scan, not a substring scan.
	
	Polymorphic and cross-library by design: results mix films, series and episodes from
	different libraries, which is what a single search box needs. Narrow with `kinds`.
	
	Ordered by sort title. Not by relevance: ranking needs a score this server does not
	compute, and a title ordering at least gives the cursor a stable position to resume
	from. A blank term matches nothing rather than everything.
	"""
	search(
		"""
		Term to match a prefix of any title word against.
		"""
		query: String!,
		"""
		Restrict to these kinds. Omit to search every kind.
		"""
		kinds: [ItemType!],
		"""
		Return items after this cursor.
		"""
		after: String,
		"""
		Return items before this cursor.
		"""
		before: String,
		"""
		Return at most this many items from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many items from the end of the range.
		"""
		last: Int
	): ItemConnection!
	"""
	What is being played right now, oldest first. A session a player has stopped keeping
	alive disappears by itself.
	"""
	playbackSessions(
		"""
		Return sessions after this cursor.
		"""
		after: String,
		"""
		Return sessions before this cursor.
		"""
		before: String,
		"""
		Return at most this many sessions from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many sessions from the end of the range.
		"""
		last: Int
	): PlaybackSessionConnection!
	"""
	Who is asking: the operator, a user, or no one.
	"""
	viewer: Viewer!
	"""
	The account the caller's connection is paired with on the extension's own service.
	Null for the operator, who connects through no extension.
	"""
	viewerAccount(
		"""
		The protocol concerned.
		"""
		extension: ExtensionType!
	): AccountLink
	"""
	The people who can be given access to this server. For its operator only.
	"""
	users(
		"""
		Return users after this cursor.
		"""
		after: String,
		"""
		Return users before this cursor.
		"""
		before: String,
		"""
		Return at most this many users from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many users from the end of the range.
		"""
		last: Int
	): UserConnection!
	"""
	What the caller's libraries of one kind added most recently, newest first: the films
	of every film library by date added, ties in the order they arrived, or every series
	library's new episodes grouped as `Library.recentlyAdded` groups them, merged by date.
	
	Pages forward only, by position.
	"""
	recentlyAdded(
		"""
		Which libraries: those of this kind.
		"""
		kind: LibraryKind!,
		"""
		Only this library, as returned in `Library.id`. One of another kind lists nothing.
		"""
		library: ID,
		"""
		Return entries after this cursor.
		"""
		after: String,
		"""
		Return at most this many entries.
		"""
		first: Int,
		"""
		Skip this many entries first. A position, for a client that pages by one; it costs the entries it skips.
		"""
		offset: Int
	): RecentlyAddedConnection!
	"""
	Every library the caller can see, ordered by identifier.
	
	Paginated as a Relay connection, with the window pushed down to storage rather than
	applied after loading. Ordering by the identifier is what makes cursors stable: adding
	a library never shifts the position of the others.
	"""
	libraries(
		"""
		Return items after this cursor.
		"""
		after: String,
		"""
		Return items before this cursor.
		"""
		before: String,
		"""
		Return at most this many items from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many items from the end of the range.
		"""
		last: Int
	): LibraryConnection!
}

type Rating {
	"""
	The provider: `imdb`, `rottentomatoes` or `themoviedb` in the reference library.

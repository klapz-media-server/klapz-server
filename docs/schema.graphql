	"""
	The item's name for a URL: lowercase, accents folded, words joined by hyphens. A film or a series by its title, a season by its series and its number (`bull-s01`), an episode by its series and its own title (`bull-good-news-about-hell`). A name, not an identity: two items can share one. `unknown` when nothing in its name survives.
	"""
	slug: String!

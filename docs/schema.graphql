	The person's name. Not unique: two people can share one, and `providerKey` is what
	tells them apart.
	"""
	name: String!
	"""
	The metadata provider's identifier for this person. Null for the people the provider
	does not know.
	"""
	providerKey: String
	"""
	A portrait, hosted by the metadata provider.
	"""
	thumbUrl: String
	"""
	The person's tags, one per role, in the order they were created: what to filter a
	library by to find the films they directed, or those they played in. Only the tags
	carried in a library the caller can see.
	"""
	credits(
		"""
		Return tags after this cursor.
		"""
		after: String,
		"""
		Return tags before this cursor.
		"""
		before: String,
		"""
		Return at most this many tags from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many tags from the end of the range.
		"""
		last: Int
	): PersonCreditConnection!
	"""
	What credits this person in any role, across the caller's libraries, hidden ones left
	out: the items of all their `credits`, each item once, in the order of `Tag.items`.
	"""
	items(
		"""
		Return items after this cursor.
		"""
		after: String,
		"""
		Return items before this cursor.
		"""
		before: String,
		"""
		Return at most this many items from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many items from the end of the range.
		"""
		last: Int,
		"""
		Narrows the list. Every field is combined with `AND`.
		"""
		filter: ItemFilterInput,
		"""
		Discard this many items before the page begins. Prefer cursors: an offset costs a traversal of every discarded row.
		"""
		offset: Int
	): ItemConnection!
	"""
	How many items `items` lists under the same filter, without paging through them.
	"""
	itemCount(
		"""
		Count only the items this filter keeps.
		"""
		filter: ItemFilterInput
	): Int!

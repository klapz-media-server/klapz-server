	"""
	direction: SortDirection!
}

"""
What a smart collection lists: its library's items, as `Library.items` lists them.
"""
input SmartCollectionRuleInput {
	"""
	Narrows the listing, as `Library.items` takes it.
	"""
	filter: ItemFilterInput
	"""
	How to order it. Omitted, by title.
	"""
	orderBy: ItemOrder
	"""
	Which direction to order in. Omitted, ascending.
	"""
	direction: SortDirection
}

type SmartPlaylistRule {
	"""
	The library it lists. Null once the owner may no longer read it, and then the
	playlist lists nothing.
	"""
	library: Library
	"""
	How the listing is ordered.
	"""
	orderBy: ItemOrder!
	"""
	Which direction it is ordered in.
	"""
	direction: SortDirection!
}

"""
What a smart playlist lists: one library's items, as `Library.items` lists them.
"""
input SmartPlaylistRuleInput {
	"""
	The library, as returned in `Library.id`. It must hold films or series.
	"""
	libraryId: ID!
	"""
	Narrows the listing, as `Library.items` takes it.
	"""
	filter: ItemFilterInput
	"""
	How to order it. Omitted, by title.
	"""
	orderBy: ItemOrder
	"""
	Which direction to order in. Omitted, ascending.
	"""
	direction: SortDirection
}

"""
Sort direction.
"""
enum SortDirection {
	"""
	Smallest or earliest first.
	"""
	ASCENDING
	"""
	Largest or latest first.
	"""
	DESCENDING
}

"""
A playback beginning.
"""
input StartPlaybackInput {
	"""
	The identifier the client chose for this playback.
	"""
	key: String!
	"""
	The player's identifier for the whole playback, which `reportPlayback` names.
	"""
	playbackId: String
	"""
	What is being played, as returned in `Item.id`.
	"""
	itemId: ID!
	"""
	The file being played, as returned in `MediaFile.id`.
	"""
	fileId: ID!
	"""
	The client's stable identifier for itself.
	"""
	clientIdentifier: String
	"""
	The application playing.
	"""
	clientProduct: String
	"""
	What happens to the video track.
	"""
	videoDecision: StreamDecisionType!
	"""
	What happens to the audio track.
	"""
	audioDecision: StreamDecisionType!
	"""
	Where playback starts, in milliseconds.
	"""
	positionMs: Int!
	"""
	The bitrate of the video sent to the player, in bits per second.
	"""
	videoBitrate: Int
	"""
	The bitrate of the audio sent to the player, in bits per second.
	"""
	audioBitrate: Int
	"""
	The width of the picture sent to the player.
	"""
	width: Int
	"""
	The height of the picture sent to the player.
	"""
	height: Int
}

"""
A stream to start.
"""
input StartStreamInput {
	"""
	Echoed back in the payload, for the client to match the two.
	"""
	clientMutationId: String
	"""
	The file to play, as returned in `MediaFile.id`.
	"""
	file: ID!
	"""
	The player reads the file as it is: it is sent untouched.
	"""
	directPlay: Boolean! = false
	"""
	How a conversion is cut up.
	"""
	protocol: StreamProtocolType! = DASH
	"""
	The audio track, as returned in `MediaStream.id`. Left out, the caller's choice.
	"""
	audioTrack: ID
	"""
	The subtitle, as returned in `MediaStream.id`. Left out, the caller's choice.
	"""
	subtitleTrack: ID
	"""
	How the subtitle reaches the player.
	"""
	subtitles: SubtitleDeliveryType! = NONE
	"""
	The size burned subtitles are drawn at, 1.0 being the normal size.
	"""
	subtitleScale: Float! = 1.0
	"""
	The most the video may weigh, in bits per second: for an adaptive stream, a ceiling on
	every quality.
	"""
	maxVideoBitrate: Int
	"""
	Convert the audio even when the player could take it as it is.
	"""
	convertAudio: Boolean! = false
	"""
	How the quality follows the link.
	"""
	quality: StreamQualityType! = FIXED
	"""
	Where to start, in milliseconds.
	"""
	positionMs: Int! = 0
	"""
	The client's own name for this stream: a later start under it replaces this one. A
	fresh name when left out.
	"""
	key: String
	"""
	The player's identifier for the whole playback, across changes of quality.
	"""
	playbackId: String
	"""
	The client's stable identifier for itself.
	"""
	clientIdentifier: String
	"""
	The application playing.
	"""
	clientProduct: String
}

"""
What `startStream` did.
"""

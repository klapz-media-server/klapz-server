"""
How deep into a library's hierarchy a listing reaches.

A series library holds three generations in one place — series, seasons and episodes —
and listing all of them side by side is almost never what a caller wants.
"""
enum ItemDepthInput {
	"""
	Entries a library shows on its front page: the films of a film library, the series of
	a series library. Seasons and episodes are reached through `Show.seasons` and
	`Season.episodes`.
	"""
	TOP_LEVEL
	"""
	Every item in the library, at any depth, side by side.
	"""
	ALL
}

"""
An edge in a connection.
"""
type ItemEdge {
	"""
	The item at the end of the edge
	"""
	node: Item!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Narrows a listing to a subset of a library.

Every field is combined with `AND`; an absent field places no constraint.
"""
input ItemFilterInput {
	"""
	Keep only items of this kind.
	
	Overrides `depth`, because naming a kind is already a statement about depth: asking
	for episodes and getting nothing because episodes have parents would be obtuse.
	"""
	kind: ItemType
	"""
	How deep to look. Defaults to the library's top level.
	"""
	depth: ItemDepthInput
	"""
	Keep only items released in or after this year.
	"""
	yearFrom: Int
	"""
	Keep only items released in or before this year.
	"""
	yearTo: Int
	"""
	Keep only items with exactly this age-rating label, as the metadata source expresses
	it — for example `fr/Tous publics`. Not comparable across countries.
	"""
	contentRating: String
	"""
	Keep only items whose studio contains this text, case-insensitively.
	
	A substring rather than a name, which is what a caller typing "HBO" means and what
	the Plex surface does. It cannot use an index — a leading wildcard has nothing to
	seek to — so it is applied after the library predicate and its cost is bounded by
	the library, not the table.
	"""
	studioContains: String
	"""
	Keep only items having a word that starts with this text.
	
	Matches the title, the sort title and the original title, with accents folded: `le`
	finds both "Le Nouveau Jouet" and "Sans Laisser de Traces". A word prefix rather than
	full-text search, because full-text indexing is the least portable feature across
	database engines and the engine is meant to stay swappable.
	"""
	titleWordPrefix: String
	"""
	Keep only items with a version at least this wide, in pixels — 3840 for 4K.
	
	The one filter that reaches past the item table, so the one that can slow a listing.
	"""
	minWidth: Int
}

"""
How a library listing is ordered.

An enum rather than a string because the value becomes a SQL identifier, which cannot be
bound as a parameter: an exhaustive match is the only form that is both injection-proof
and verifiable by reading.

Short on purpose. Both variants are backed by a non-null column, which is what lets a
cursor locate a position unambiguously; ordering by a nullable one — year, rating —
additionally needs the cursor to encode absence and the null position to be pinned.
"""
enum ItemOrder {
	"""
	By sort title, falling back to the title. Case-insensitive.
	"""
	TITLE
	"""
	By when the item was added to the library.
	"""
	ADDED_AT
}

"""
The kind of media an item is.
"""
enum ItemType {
	"""
	A film.
	"""
	MOVIE
	"""
	A television series.
	"""
	SHOW
	"""
	A season of a series.
	"""
	SEASON
	"""
	An episode of a series.
	"""
	EPISODE
}

type Library implements Node {
	"""
	Globally unique, opaque identifier. Pass it to `node` to refetch this library.
	
	Treat it as a token: its encoding is not part of the contract and may change.
	"""
	id: ID!
	"""
	What kind of media this library holds.
	"""
	kind: LibraryKind!
	"""
	Display name, as the owner set it.
	"""
	title: String!
	"""
	Title to sort by when it differs from `title`, for example with a leading article
	removed. Null when `title` already sorts correctly.
	"""
	titleSort: String
	"""
	BCP 47 language tag used when matching metadata, for example `fr-FR`.
	"""
	language: String!
	"""
	Stable identifier that survives renaming, used to recognize this library across
	servers and backups.
	"""
	uuid: String!
	"""
	Whether the library is excluded from normal browsing.
	"""
	hidden: Boolean!
	"""
	When the library was created, in seconds since the Unix epoch.
	"""
	createdAt: Int!
	"""
	When the library's settings or contents last changed, in seconds since the Unix epoch.
	"""
	updatedAt: Int!
	"""
	When the library was last scanned, in seconds since the Unix epoch. Null if it never
	has been.
	"""
	scannedAt: Int
	"""
	Monotonic counter that advances whenever the library's contents change.
	
	A string rather than an `Int` because the value exceeds 32 bits, which is the width
	GraphQL's `Int` guarantees. It is a counter, not a timestamp: compare it for
	inequality to detect a change, do not read it as a time.
	"""
	contentChangedAt: String!
	"""
	Filesystem locations this library scans.
	
	Loaded in one batch across every library in the result, so asking for roots on a
	large list costs a single storage query.
	"""
	roots: [Root!]!
	"""
	The items this library holds.
	
	Polymorphic: a movie library yields `Movie`, a show library yields `Show`. Use inline
	fragments to read kind-specific fields.
	
	Filtering, ordering and the page window are all pushed down to storage, so the cost
	does not grow with the size of the library.
	"""
	items(
		"""
		Return items after this cursor.
		"""
		after: String,
		"""
		Return items before this cursor.
		"""
		before: String,
		"""
		Return at most this many items from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many items from the end of the range.
		"""
		last: Int,
		"""
		Narrows the listing. Every field is combined with `AND`.
		"""
		filter: ItemFilterInput,
		"""
		How to order the listing.
		"""
		orderBy: ItemOrder,
		"""
		Which direction to order in.
		"""
		direction: SortDirection,
		"""
		Discard this many items before the page begins. Prefer cursors: an offset costs the database a traversal of every discarded row, and a concurrent insert shifts it. Provided because a client that renders a scrollbar needs to jump to an absolute position, which no cursor can express.
		"""
		offset: Int
	): ItemConnection!
	"""
	Aggregates over the contents of this library.
	"""
	stats(
		"""
		Count only the items this filter keeps.
		"""
		filter: ItemFilterInput
	): LibraryStats!
}

type LibraryConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.

	Why it could not be started. Empty when it was.
	"""
	userErrors: [StreamUserError!]!
}

type StatedChapter {
	"""
	The title as the file writes it, numbered or not: `Chapter 01`.
	"""
	title: String
	"""
	Where it starts, in microseconds.
	"""
	startUs: Int64
}

type StatedFile {
	"""
	The demuxer's names for the format: `matroska,webm`, `mov,mp4,m4a,3gp,3g2,mj2`.
	"""
	formatName: String
	"""
	The duration the container declares, in microseconds.
	`MediaFile.durationMs` may be the time the packets were measured to span instead.
	"""
	durationUs: Int64
	"""
	The bitrate the container declares, in bits per second.
	"""
	bitrate: Int
}

type StatedTrack {
	"""
	The language as the file states it, as written: `fre`, `fr-FR`, `und`, `fra,fra`.
	Null when it states none — a Matroska track saying `und` among them, which
	`MediaStream.language` reads as English.
	"""
	language: String
	"""
	An MP4 track's own name, from its `udta`: a title some muxers write there, which
	`MediaStream.title` does not read.
	"""
	name: String
	"""
	The handler an MP4 track names: `SoundHandler`, sometimes a title.
	"""
	handlerName: String
	"""
	The unit of the track's timestamps, `num/den`: `1/1000` in Matroska.
	"""
	timeBase: String
	"""
	The container's codec tag as ffprobe prints it: `avc1`, or `[0][0][0][0]` where the
	container names none.
	"""
	codecTag: String
	"""
	Bits per second the track's header declares.
	"""
	bitrate: Int
	"""
	Bits per second the muxer measured and tagged: Matroska's `BPS`, else its bytes over its
	duration.
	"""
	taggedBitrate: Int
}

"""
A stream to stop.
"""
input StopStreamInput {
	"""
	Echoed back in the payload, for the client to match the two.
	"""
	clientMutationId: String
	"""
	The stream's session, as returned in `StartStreamPayload.session.id`.
	"""
	session: ID!
}

"""
What `stopStream` did.
"""
type StopStreamPayload {
	"""
	The value the input carried.
	"""
	clientMutationId: String
	"""
	Whether there was a stream to stop.
	"""
	stopped: Boolean!
}

"""
What the server does to a track on its way to the player.
"""
enum StreamDecisionType {
	"""
	Passed along untouched.
	"""
	COPY
	"""
	Converted to something the player can read.
	"""
	TRANSCODE
}

"""
How the file reaches the player.
"""
enum StreamDeliveryType {
	"""
	The file as it is.
	"""
	DIRECT_PLAY
	"""
	The tracks repackaged, the video untouched.
	"""
	DIRECT_STREAM
	"""
	The video re-encoded.
	"""
	TRANSCODE
}

"""
Why a stream could not be started.
"""
enum StreamErrorCode {
	"""
	No such file, or not one the caller can see.
	"""
	FILE_NOT_FOUND
	"""
	The file is known but not on this machine.
	"""
	FILE_MISSING
	"""
	The track named is not one of the file's, of that kind; or the file has none.
	"""
	TRACK_NOT_FOUND
	"""
	The video would need a conversion this server does not do.
	"""
	VIDEO_NOT_CONVERTIBLE
	"""
	The subtitle cannot be delivered the way asked: an image subtitle, text over HLS, or no
	fonts to burn with.
	"""
	SUBTITLE_NOT_DELIVERABLE
	"""
	Too many streams are running.
	"""
	TOO_MANY_STREAMS
	"""
	The key names a session an owner terminated: its player has to stop first.
	"""
	SESSION_TERMINATED
}

"""
A stream that was started.
"""
type StreamObject {
	"""
	How the file reaches the player.
	"""
	delivery: StreamDeliveryType!
	"""
	How it is cut up. Null for direct play.
	"""
	protocol: StreamProtocolType
	"""
	How its quality follows the link, as asked.
	"""
	quality: StreamQualityType!
	"""
	What happens to the video track.
	"""
	videoDecision: StreamDecisionType!
	"""
	What happens to the audio track.
	"""
	audioDecision: StreamDecisionType!
	"""
	Where the player reads it, a path on this server: the manifest of a conversion, the file
	itself for direct play. It carries its own secret and needs no token.
	"""
	url: String!
	"""
	Where the player reads text subtitles, when they were asked for.
	"""
	subtitlesUrl: String
	"""
	The bitrate of the video sent, in bits per second, when known: at the start, for an
	adaptive stream.
	"""
	videoBitrate: Int
	"""
	The bitrate of the audio sent, in bits per second, when known.
	"""
	audioBitrate: Int
	"""
	The width of the picture sent, when known.
	"""
	width: Int
	"""
	The height of the picture sent, when known.
	"""
	height: Int
}

"""
How a converted stream is cut up for the player.
"""
enum StreamProtocolType {
	"""
	MPEG-DASH, fragmented MP4.
	"""
	DASH
	"""
	HTTP Live Streaming, MPEG-TS segments.
	"""
	HLS
}

"""
How a conversion's quality follows the link.
"""
enum StreamQualityType {
	"""
	One quality for the whole stream, the best within `maxVideoBitrate`.
	"""
	FIXED
	"""
	One quality announced, which the server lowers and raises by measuring how fast the
	player receives it. Always a re-encode, at one picture size.
	"""
	SERVER_ADAPTIVE
	"""
	Every quality announced, the video copied first when the file allows it, and the player
	chooses among them as it goes.
	"""
	CLIENT_ADAPTIVE
}

"""
A problem with what was asked, as opposed to a failure of the server.
"""
type StreamUserError {
	"""
	The input field at fault, as a path from the input's root.
	"""
	field: [String!]!
	"""
	What went wrong, for a person.
	"""
	message: String!
	"""
	What went wrong, for a program.
	"""
	code: StreamErrorCode!
}

type SubtitleAnalysis {
	"""
	The format of a sidecar subtitle file: `srt`, `ssa`. Null for an embedded track,
	whose codec says it.
	"""
	format: String
	"""
	Whether the captions ride inside the video bitstream (EIA-608) rather than in a
	track of their own.
	"""
	isEmbeddedInVideo: Boolean!
	"""
	The width of the frame a picture subtitle is drawn for: 1920 for a Blu-ray's PGS.
	"""
	canvasWidth: Int
	"""
	The height of that frame.
	"""
	canvasHeight: Int
}

"""
How a subtitle reaches the player of a conversion.
"""
enum SubtitleDeliveryType {
	"""
	No subtitle, whatever was chosen.
	"""
	NONE
	"""
	Drawn into the picture, which re-encodes the video.
	"""
	BURN
	"""
	As ASS text beside the stream, for the player to draw. DASH only.
	"""
	TEXT
}

"""
Why a subtitle mutation refused.
"""
enum SubtitleErrorCode {
	"""
	No track the caller may read has this id.
	"""
	TRACK_NOT_FOUND
	"""
	The track is a video or an audio track.
	"""
	NOT_A_SUBTITLE
	"""
	The subtitle is inside the media file, not a file of its own.
	"""
	NOT_A_SIDECAR
	"""
	The caller may read the library but not change it: only its admins and the server's
	owners delete a subtitle.
	"""
	NOT_ALLOWED
}

"""
A request a subtitle mutation refused, and where in the input the reason lies.
"""
type SubtitleUserError {
	"""
	The path to the input field at fault.
	"""
	field: [String!]!
	"""
	What went wrong, for a person to read.
	"""
	message: String!
	"""
	What went wrong, for a program to branch on.
	"""
	code: SubtitleErrorCode!
}

type Tag implements Node {
	"""
	Globally unique, opaque identifier. Pass it to `node` to refetch this tag, or to an
	item filter to list what carries it.
	"""
	id: ID!
	"""
	What the tag classifies or credits.
	
	A person credited in two roles has two tags, one per role: "films she wrote" and
	"films she produced" are different filters.
	"""
	kind: TagType!
	"""
	The genre, the country, or the name as credited — which can differ from the person's
	current name, as `Andy Garcia` does from `Andy García`.
	"""
	name: String!
	"""
	Who a credit names. Null for a genre or a country.
	"""
	person: Person
	"""
	What carries this tag, across the caller's libraries, hidden ones left out.
	
	A series is listed for a tag on it or on any of its episodes, once: an actor's guest
	appearances name the series, not each episode. The filter narrows that list further,
	and naming a `kind` reaches below the top level as it does on `Library.items`.
	
	Library by library, by the library's title; within one, films by title and series in
	the order they arrived.
	"""
	items(
		"""
		Return items after this cursor.
		"""
		after: String,
		"""
		Return items before this cursor.
		"""
		before: String,
		"""
		Return at most this many items from the start of the range.
		"""
		first: Int,
		"""
		Return at most this many items from the end of the range.
		"""
		last: Int,
		"""
		Narrows the list. Every field is combined with `AND`.
		"""
		filter: ItemFilterInput,
		"""
		Discard this many items before the page begins. Prefer cursors: an offset costs a traversal of every discarded row.
		"""
		offset: Int
	): ItemConnection!
	"""
	How many items `items` lists under the same filter, without paging through them.
	"""
	itemCount(
		"""
		Count only the items this filter keeps.
		"""
		filter: ItemFilterInput
	): Int!
}

type TagConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [TagEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Tag!]!
}

"""
An edge in a connection.
"""
type TagEdge {
	"""
	The item at the end of the edge
	"""
	node: Tag!
	"""
	The character played, for a cast member, as the source credits it — sometimes
	several, as in `Homer Simpson / Barney Gumble`. Null for any other kind, and for a
	guest gathered from episodes, whose character varies from one to the next.
	"""
	character: String
	"""
	How many episodes below the item carry this credit. Null on an item with no episodes:
	a film, or an episode itself.
	"""
	episodeCount: Int
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Keeps items carrying at least one of the named tags of one kind.

`ids` and `names` combine with `OR`, so a condition can mix both. Several conditions in
one filter combine with `AND`: "a comedy and a drama" is two conditions, "a comedy or a
drama" is one.
"""
input TagFilterInput {
	"""
	The kind of tag to match.
	"""
	kind: TagType!
	"""
	Tags by identifier, as returned in `Tag.id`.
	"""
	ids: [ID!]
	"""
	Tags by name, matched exactly but ignoring case. A name shared by two people matches
	both.
	"""
	names: [String!]
}

type TagListConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [TagListEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Tag!]!
	"""
	How many tags the list holds in all, across every page.
	"""
	totalCount: Int!
}

"""
An edge in a connection.
"""
type TagListEdge {
	"""
	The item at the end of the edge
	"""
	node: Tag!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
What a tag classifies or credits.
"""
enum TagType {
	"""
	A genre, in the library's metadata language: `Comédie` in a French library.
	"""
	GENRE
	"""
	A country of production.
	"""
	COUNTRY
	"""
	A person credited as director.
	"""
	DIRECTOR
	"""
	A person credited as writer.
	"""
	WRITER
	"""
	A person credited in the cast.
	"""
	ACTOR
	"""
	A person credited as producer.
	"""
	PRODUCER
}

type TagUse {
	"""
	The tag.
	"""
	tag: Tag!
	"""
	The library whose items carry it.
	"""
	library: Library
	"""
	How many of the library's items carry the tag, whatever their kind: in a series
	library, the series and the episodes crediting someone.
	"""
	itemCount: Int!
}

type TagUseConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [TagUseEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [TagUse!]!
}

"""
An edge in a connection.
"""
type TagUseEdge {
	"""
	The item at the end of the edge
	"""
	node: TagUse!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}


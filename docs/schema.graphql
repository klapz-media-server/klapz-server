	"""
	The address announced to that service for clients to reach this server.
	"""
	connectionUri: String!
	"""
	When that service last accepted the address. Null until it
	has; the server keeps trying.
	"""
	publishedAt: DateTime
}

"""
A problem with what was asked, as opposed to a failure of the server.
"""
type AccountUserError {
	"""
	The input field at fault, as a path from the input's root.
	"""
	field: [String!]!
	"""
	What went wrong, for a person.
	"""
	message: String!
	"""
	What went wrong, for a program.
	"""
	code: AccountErrorCode!
}


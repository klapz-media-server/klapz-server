"""
How a viewing came about.
"""
enum ViewingKindType {
	"""
	A playback reached 90% of the runtime.
	"""
	PLAYED
	"""
	The item was marked watched without being played: each episode of a season or a
	series marked at once is one.
	"""
	MARKED
}

"""
What a report did.
"""
enum ViewingOutcome {
	"""
	Nothing was kept: no runtime given, or a playback that opened past the end.
	"""
	IGNORED
	"""
	Nothing kept yet: the playback is under way but short of a minute.
	"""
	EARLY
	"""
	The position was kept.
	"""
	PROGRESS
	"""
	The playback counted as a viewing, with this report or an earlier one.
	"""
	COMPLETED
}


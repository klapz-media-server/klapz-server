"""
A text field whose distinct values a library can be browsed by.
"""
enum TextField {
	"""
	The certification, as the metadata provider states it: `PG-13`, `fr/12`.
	"""
	CONTENT_RATING
	"""
	The studio or network that made the item.
	"""
	STUDIO
}

"""
How well an item's title answers a search term, from the best.
"""
enum TitleMatch {
	"""
	The title or the sort title is the term, accents and case aside.
	"""
	EXACT
	"""
	The first word of the title or of the original title is the term's first word. A
	word ends at a space or an apostrophe here, so `Amelie's Miracle` opens with `amelie`.
	"""
	LEADING_WORD
	"""
	The title or the original title begins with the term's first word.
	"""
	LEADING_PREFIX
	"""
	Some word of a title begins with each word of the term.
	"""
	ANYWHERE
}

"""
A value a track holds.
"""
enum TrackField {
	"""
	The codec of a video track: `h264`, `hevc`.
	"""
	VIDEO_CODEC
	"""
	The codec of an audio track: `ac3`, `eac3`, `truehd`.
	"""
	AUDIO_CODEC
	"""
	The channel layout of an audio track, as the analysis names it: `5.1(side)`, `stereo`.
	"""
	AUDIO_LAYOUT
	"""
	The format of a subtitle track, embedded or beside the file: `srt`, `pgs`.
	"""
	SUBTITLE_CODEC
	"""
	The language an audio track states, as its file writes it: `fre` and `fra` apart. Only
	a scanned file states one.
	"""
	AUDIO_LANGUAGE
	"""
	The language a subtitle track states, as its file writes it.
	"""
	SUBTITLE_LANGUAGE
}

"""
Keeps items with a track of any of their versions holding one of the values, matched

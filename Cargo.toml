[workspace]
members = ["crates/core", "crates/db", "crates/api", "crates/transcoder", "crates/api-plex", "crates/api-jellyfin", "crates/server", "crates/scanner", "crates/agents"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
klapz-core = { path = "crates/core" }
klapz-db = { path = "crates/db" }
klapz-api = { path = "crates/api" }
klapz-api-plex = { path = "crates/api-plex" }
klapz-api-jellyfin = { path = "crates/api-jellyfin" }
klapz-transcoder = { path = "crates/transcoder" }
klapz-agents = { path = "crates/agents" }
klapz-scanner = { path = "crates/scanner", default-features = false }

async-graphql = { version = "7", features = ["dataloader"] }
base64 = "0.22"
# Dates on the official API, RFC 3339 read and written; already in the tree through SeaORM.
chrono = { version = "0.4", default-features = false, features = ["std"] }
async-graphql-axum = "7"
async-trait = "0.1"
# Password hashing for sign-in: Argon2id, the OWASP recommendation, in pure Rust.
argon2 = { version = "0.5", features = ["std"] }
# Session tokens. Version 9 signs HS256 with `ring`, already in the tree through rustls; later
# versions require choosing a new crypto backend.
jsonwebtoken = { version = "9", default-features = false }
axum = "0.8"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower = "0.5"
tower-http = { version = "0.6", default-features = false, features = ["trace", "timeout", "limit", "set-header", "fs", "cors"] }
sea-orm = { version = "1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
subtle = "2"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
# Already in the tree transitively; declared so `core` can fold accents for the title
# word index without a second normalization implementation.
unicode-normalization = "0.1"
# Already in the tree through axum and reqwest; declared to stream a response body.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Settings from a `.env` file, which never override a variable already set.
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Whole-program optimization: the binary is mostly monomorphized code (async-graphql resolvers,
# async handlers), which per-crate units cannot deduplicate. Slower to build, smaller and no
# slower to run.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
# Annotating every getter and constructor with #[must_use] adds noise on every line it
# touches without catching a bug we can plausibly write; the lint fires on ~all public fns.
must_use_candidate = "allow"
# Crate names are prefixed `klapz_`, so types inevitably echo their module.
module_name_repetitions = "allow"

# A debug build of the workspace passed 30 GB, the disk's limit here: line tables keep
# backtraces readable in our crates, and the dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Builds the server and the scanner for each platform. Every push and pull request gets the
# binaries as workflow artifacts; each push to the default branch also publishes them as a
# GitHub release. ffmpeg is not part of it: the desktop package takes it from its own release.
#
# Versions are git tags `vX.Y.Z`. Each push to the default branch releases the last one with
# its patch number raised (the first release takes the server crate's version). Run the
# workflow by hand to raise the minor or the major instead.

name: Package

on:
  push:
    branches: [main, master]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to raise (on the default branch)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One run at a time per branch: two pushes in a row must not compute the same version.
# Elsewhere than the default branch, a newer push cancels the older run.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, to find the last version

      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$last" ]; then
            next=$(sed -n 's/^version = "\(.*\)"$//p' crates/server/Cargo.toml | head -n1)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *)     next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            release=true
            version="$next"
          else
            release=false
            # `g` keeps the identifier valid semver when the hash starts with a 0.
            version="$next-dev.g$(git rev-parse --short HEAD)"
          fi
          echo "Last release: ${last:-none} — this build: $version (release: $release)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 for glibc 2.35: built on anything newer, the binaries would refuse to
          # start on older distributions.
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          exe=""
          if [[ "$RUNNER_OS" == Windows ]]; then exe=".exe"; fi
          {
            echo "SUFFIX=v$VERSION-${{ matrix.platform }}"
            echo "EXE=$exe"
          } >> "$GITHUB_ENV"

      # The server reports CARGO_PKG_VERSION to its clients: stamp it in both crates and in the
      # lock file, which --locked would otherwise find out of date.
      - name: Stamp the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for crate in server scanner; do
            perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' "crates/$crate/Cargo.toml"
            perl -0pi -e 's/(name = "klapz-'"$crate"'"
version = )"[^"]*"/$1"$ENV{VERSION}"/' Cargo.lock
          done
          git diff --stat

      - name: Install Rust
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # The ARM runner is the smallest of the lot: with fat LTO, linking both binaries at once
      # exhausts its memory and the runner dies, so it gets swap and builds one job at a time.
      - name: Add swap
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo fallocate -l 8G /klapz-swapfile
          sudo chmod 600 /klapz-swapfile
          sudo mkswap /klapz-swapfile
          sudo swapon /klapz-swapfile
          free -h

      - name: Build
        env:
          CARGO_BUILD_JOBS: ${{ matrix.platform == 'linux-arm64' && '1' || 'default' }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p klapz-server -p klapz-scanner

      - name: Lay out the binaries
        run: |
          mkdir dist
          for component in server scanner; do
            cp "target/${{ matrix.target }}/release/klapz-$component$EXE" "dist/klapz-$component-$SUFFIX$EXE"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klapz-${{ env.SUFFIX }}
          path: dist/*
          if-no-files-found: error
          compression-level: 6

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true

      - name: Publish the release
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum klapz-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes klapz-* SHA256SUMS

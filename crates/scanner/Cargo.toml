[package]
name = "klapz-scanner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Reading files through ffprobe and ffmpeg, which the server runs. Without it the crate is only
# the analysis' types, which the scan's storage depends on.
engine = ["dep:tokio"]
default = ["engine"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>klapz users</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f6f4;
    --card: #ffffff;
    --ink: #1c1c1a;
    --muted: #6c6b66;
    --line: #dfddd7;
    --accent: #b5700a;
    --accent-ink: #ffffff;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #161615;
      --card: #20201e;
      --ink: #ecebe6;
      --muted: #9b9a94;
      --line: #35342f;
      --accent: #e5a00d;
      --accent-ink: #1c1c1a;
      --danger: #f2877f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 20px; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; }
  form.line { display: flex; gap: 8px; margin-bottom: 20px; }
  input, select, button { font: inherit; color: inherit; }
  input[type=email], input[type=password], input[type=text], select {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
  }
  form.line input { flex: 1; min-width: 0; }
  button {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .user {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .who { flex: 1; min-width: 180px; overflow-wrap: anywhere; }
  .who strong { font-weight: 600; }
  .note { color: var(--muted); font-size: 13px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { width: 34px; height: 18px; accent-color: var(--accent); margin: 0; cursor: pointer; }
  .plex { margin-top: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  code { font: 12.5px ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .libraries { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 18px; margin-top: 10px; }
  .library { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .library span { overflow-wrap: anywhere; }
  .library select { padding: 3px 6px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  #message { min-height: 22px; margin: 0 0 10px; font-size: 14px; color: var(--danger); }
  dialog {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    width: min(520px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog h2 { font-size: 17px; margin: 0 0 6px; }
  dialog label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
  dialog .copy { display: flex; gap: 8px; }
  dialog .copy input { flex: 1; min-width: 0; font: 12.5px ui-monospace, Consolas, monospace; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  dialog input { width: 100%; }
  dialog .error { min-height: 20px; margin: 10px 0 0; font-size: 14px; color: var(--danger); }
  a { color: var(--accent); }
  [hidden] { display: none !important; }
  .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; color: var(--muted); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .bar h1 { margin: 0; }
  form.stack { display: grid; gap: 8px; max-width: 360px; margin-bottom: 20px; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <h1>klapz <span>users</span></h1>
    <span id="session" hidden><span id="whoami" class="note"></span> <button id="signout" type="button">Sign out</button></span>
  </div>
  <p id="message" role="status"></p>

  <form id="signin" class="stack" hidden>
    <input id="signin-login" type="text" placeholder="Username or e-mail address" autocomplete="username" aria-label="Username or e-mail address" required>
    <input id="signin-password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
    <button class="primary">Sign in</button>
  </form>

  <section id="content" hidden>
    <form id="add" class="line">
      <input id="username" type="text" placeholder="username" autocomplete="off" aria-label="Username of the new user" required>
      <input id="email" type="email" placeholder="name@example.org (optional)" autocomplete="off" aria-label="E-mail address of the new user">
      <button class="primary">Add user</button>
    </form>
    <div id="users"></div>
  </section>
</main>

<dialog id="credentials">
  <h2>Plex token for <span id="credentials-name"></span></h2>
  <p class="note">Copy it now: it is shown only once, and only a digest is kept.</p>
  <label for="credentials-token">Token</label>
  <div class="copy">
    <input id="credentials-token" type="text" readonly>
    <button id="credentials-copy" type="button">Copy</button>
  </div>
  <label>Server identifier</label>
  <code id="credentials-server"></code>
  <div class="actions"><button id="credentials-close" type="button" class="primary">Done</button></div>
</dialog>

<dialog id="pair">
  <form id="pair-form">
    <h2>Pair <span id="pair-name"></span> with Plex</h2>
    <p class="note">While signed in to this user's Plex account, open <a href="https://plex.tv/claim" target="_blank" rel="noreferrer">plex.tv/claim</a> and paste the code here. It works once and lasts four minutes.</p>
    <label for="pair-code">Claim code</label>
    <input id="pair-code" type="text" placeholder="claim-" autocomplete="off" required>
    <label for="pair-address">Address Plex clients will use to reach this server</label>
    <input id="pair-address" type="text" placeholder="https://alice.plex.example.org:443" autocomplete="off" required>
    <p id="pair-error" class="error" role="status"></p>
    <div class="actions">
      <button id="pair-cancel" type="button">Cancel</button>
      <button id="pair-submit" class="primary">Pair</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

const VIEWER_QUERY = `{ viewer { role user { id username } } }`;
const LIST_QUERY = `{
  users(first: 500) {
    edges { node {
      id username email role builtIn active createdAt
      libraryPermissions { edges { node { role library { id } } } }
      extensions { edges { node { extension externalId enabled account { accountName connectionUri publishedAt } } } }
    } }
  }
  libraries(first: 500) { edges { node { id title } } }
}`;
const USER_ERRORS = `userErrors { message }`;
const SIGN_IN = `mutation($input: SignInInput!) { signIn(input: $input) { user { id } ${USER_ERRORS} } }`;
const SIGN_OUT = `mutation { signOut }`;
const CREATE_USER = `mutation($input: CreateUserInput!) { createUser(input: $input) { user { id } ${USER_ERRORS} } }`;
const DELETE_USER = `mutation($input: UserInput!) { deleteUser(input: $input) { deleted ${USER_ERRORS} } }`;
const ACTIVATE_USER = `mutation($input: UserInput!) { activateUser(input: $input) { user { id } ${USER_ERRORS} } }`;
const DEACTIVATE_USER = `mutation($input: UserInput!) { deactivateUser(input: $input) { user { id } ${USER_ERRORS} } }`;
const SET_ROLE = `mutation($input: SetUserRoleInput!) { setUserRole(input: $input) { user { id } ${USER_ERRORS} } }`;
const SET_PERMISSION = `mutation($input: SetLibraryPermissionInput!) { setLibraryPermission(input: $input) }`;
const REMOVE_PERMISSION = `mutation($userId: ID!, $libraryId: ID!) { removeLibraryPermission(userId: $userId, libraryId: $libraryId) }`;
const CONNECT_PLEX = `mutation($userId: ID!) { connectExtension(userId: $userId, extension: PLEX) { token userExtension { externalId } } }`;
const DISABLE_PLEX = `mutation($userId: ID!) { disableExtension(userId: $userId, extension: PLEX) }`;
const CONNECT_JELLYFIN = `mutation($userId: ID!) { connectExtension(userId: $userId, extension: JELLYFIN) { userExtension { enabled } } }`;
const DISABLE_JELLYFIN = `mutation($userId: ID!) { disableExtension(userId: $userId, extension: JELLYFIN) }`;

const PAIR_PLEX = `mutation($input: PairExtensionInput!) { pairExtension(input: $input) { publishedAt } }`;
const UNPAIR_PLEX = `mutation($userId: ID!) { unpairExtension(userId: $userId, extension: PLEX) }`;
const MOVE_PLEX = `mutation($input: MoveExtensionInput!) { moveExtension(input: $input) { publishedAt } }`;

const byId = (id) => document.getElementById(id);
const expanded = new Set();
let pairing = null;
let libraries = [];

class SignInNeeded extends Error {}

/** The session travels in its `HttpOnly` cookie, which the browser sends to this origin. */
async function graphql(query, variables) {
  const response = await fetch("/graphql", {
    method: "POST",
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables }),
  });
  if (response.status === 401) throw new SignInNeeded("Sign in again.");
  const body = await response.json();
  if (body.errors && body.errors.length) throw new Error(body.errors[0].message);
  return body.data;
}

/** A Relay payload's first user error, as an exception. */
async function mutate(query, input, field) {
  const payload = (await graphql(query, { input }))[field];
  if (payload.userErrors.length) throw new Error(payload.userErrors[0].message);
  return payload;
}

function say(text) { byId("message").textContent = text || ""; }

/** Text only ever goes through `textContent`: a username or an address is someone else's input. */
function el(tag, properties, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(properties || {})) {
    if (name === "on") {
      for (const [event, handler] of Object.entries(value)) node.addEventListener(event, handler);
    } else {
      node[name] = value;
    }
  }
  node.append(...children.filter((child) => child !== null));
  return node;
}

async function act(work) {
  say("");
  try {
    await work();
    await load();
  } catch (error) {
    if (error instanceof SignInNeeded) showSignIn(error.message);
    else { say(error.message === "not found" ? "Not found, or not allowed." : error.message); await load().catch(() => {}); }
  }
}

function showSignIn(text) {
  byId("content").hidden = true;
  byId("session").hidden = true;
  byId("signin").hidden = false;
  say(text);
  byId("signin-login").focus();
}

function showCredentials(user, connected) {
  byId("credentials-name").textContent = user.username;
  byId("credentials-token").value = connected.token;
  byId("credentials-server").textContent = connected.userExtension.externalId;
  byId("credentials-copy").textContent = "Copy";
  byId("credentials").showModal();
  byId("credentials-token").select();
}

async function connectPlex(user) {
  const data = await graphql(CONNECT_PLEX, { userId: user.id });
  showCredentials(user, data.connectExtension);
}

function showPairing(user) {
  pairing = user;
  byId("pair-name").textContent = user.username;
  byId("pair-code").value = "";
  byId("pair-error").textContent = "";
  byId("pair").showModal();
  byId("pair-code").focus();
}

function pairingRow(user, plex) {
  const account = plex.account;
  if (!account) {
    return el("button", { type: "button", textContent: "Pair with Plex", on: { click: () => showPairing(user) } });
  }
  const state = account.publishedAt
    ? `published ${new Date(account.publishedAt).toLocaleString()}`
    : "not published yet, will retry";
  return el("span", { className: "note" },
    "Paired with ", el("strong", { textContent: account.accountName }), " at ",
    el("code", { textContent: account.connectionUri }), ` (${state}) `,
    el("button", {
      type: "button",
      textContent: "Change address",
      on: { click: () => {
        const address = prompt("Address Plex clients will use to reach this server", account.connectionUri);
        if (address && address.trim() !== account.connectionUri) {
          act(() => graphql(MOVE_PLEX, { input: {
            userId: user.id,
            extension: "PLEX",
            connectionUri: address.trim(),
          } }));
        }
      } },
    }),
    " ",
    el("button", {
      type: "button",
      textContent: "Unpair",
      on: { click: () => {
        if (confirm(`Unpair ${user.username} from its Plex account? Clients that found this server through plex.tv stop getting in.`)) {
          act(() => graphql(UNPAIR_PLEX, { userId: user.id }));
        }
      } },
    }),
  );
}

function extensionOf(user, extension) {
  const edge = user.extensions.edges.find((candidate) => candidate.node.extension === extension);
  return edge ? edge.node : null;
}

function plexOf(user) {
  return extensionOf(user, "PLEX");
}

// Jellyfin's clients sign in with the user's password: switching it on is all it takes.
function jellyfinSwitch(user) {
  const jellyfin = extensionOf(user, "JELLYFIN");
  const toggle = el("input", {
    type: "checkbox",
    checked: Boolean(jellyfin && jellyfin.enabled),
    on: { change: () => act(async () => {
      if (toggle.checked) {
        await graphql(CONNECT_JELLYFIN, { userId: user.id });
      } else if (confirm(`Disable Jellyfin for ${user.username}? Every Jellyfin device it signed in from is signed out.`)) {
        await graphql(DISABLE_JELLYFIN, { userId: user.id });
      }
    }) },
  });
  return el("label", { className: "switch" }, toggle, el("span", { textContent: "Jellyfin" }));
}

function libraryRow(user, library, role) {
  const select = el("select", {
    ariaLabel: `Access to ${library.title}`,
    on: { change: () => act(async () => {
      if (select.value === "") {
        await graphql(REMOVE_PERMISSION, { userId: user.id, libraryId: library.id });
      } else {
        await graphql(SET_PERMISSION, { input: { userId: user.id, libraryId: library.id, role: select.value } });
      }
    }) },
  },
    el("option", { value: "", textContent: "No access" }),
    el("option", { value: "VIEWER", textContent: "Viewer" }),
    el("option", { value: "ADMIN", textContent: "Admin" }),
  );
  select.value = role || "";
  return el("label", { className: "library" }, el("span", { textContent: library.title }), select);
}

/** What an owner can change about a user's standing; the built-in account has nothing to change. */
function standing(user) {
  if (user.builtIn) return el("span", { className: "note", textContent: "Built-in owner" });
  const role = el("select", {
    ariaLabel: `Role of ${user.username}`,
    on: { change: () => act(() => mutate(SET_ROLE, { userId: user.id, role: role.value }, "setUserRole")) },
  },
    el("option", { value: "USER", textContent: "User" }),
    el("option", { value: "OWNER", textContent: "Owner" }),
  );
  role.value = user.role;
  const active = el("input", {
    type: "checkbox",
    checked: user.active,
    on: { change: () => act(() => active.checked
      ? mutate(ACTIVATE_USER, { userId: user.id }, "activateUser")
      : mutate(DEACTIVATE_USER, { userId: user.id }, "deactivateUser")) },
  });
  return el("span", { className: "head" },
    role,
    el("label", { className: "switch" }, active, el("span", { textContent: "Active" })),
    el("button", {
      type: "button",
      className: "danger",
      textContent: "Delete",
      on: { click: () => {
        if (confirm(`Delete ${user.username}, its permissions and its Plex connection?`)) {
          act(() => mutate(DELETE_USER, { userId: user.id }, "deleteUser"));
        }
      } },
    }),
  );
}

function userCard(user) {
  const plex = plexOf(user);
  const enabled = Boolean(plex && plex.enabled);
  const roles = new Map(user.libraryPermissions.edges
    .filter((edge) => edge.node.library)
    .map((edge) => [edge.node.library.id, edge.node.role]));

  const toggle = el("input", {
    type: "checkbox",
    checked: enabled,
    on: { change: () => act(async () => {
      if (toggle.checked) {
        await connectPlex(user);
      } else if (confirm(`Disable Plex for ${user.username}? Its token stops working, and enabling it again issues a new one.`)) {
        await graphql(DISABLE_PLEX, { userId: user.id });
      }
    }) },
  });

  const added = new Date(user.createdAt).toLocaleDateString();
  const details = user.role === "OWNER"
    ? el("p", { className: "note", textContent: "An owner reaches every library." })
    : el("details", {
      open: expanded.has(user.id),
      on: { toggle: () => {
        if (details.open) expanded.add(user.id); else expanded.delete(user.id);
      } },
    },
      el("summary", { textContent: `Libraries: ${roles.size} of ${libraries.length}` }),
      el("div", { className: "libraries" }, ...libraries.map((library) => libraryRow(user, library, roles.get(library.id)))),
    );

  return el("article", { className: "user" },
    el("div", { className: "head" },
      el("div", { className: "who" },
        el("strong", { textContent: user.username }),
        user.role === "OWNER" ? el("span", { className: "badge", textContent: "owner" }) : null,
        user.active ? null : el("span", { className: "badge", textContent: "inactive" }),
        el("div", { className: "note", textContent: `${user.email ? `${user.email} · ` : ""}Added ${added}` }),
      ),
      el("label", { className: "switch" }, toggle, el("span", { textContent: "Plex" })),
      jellyfinSwitch(user),
      standing(user),
    ),
    enabled ? el("div", { className: "plex" },
      el("span", { className: "note" }, "Server ", el("code", { textContent: plex.externalId })),
      el("button", {
        type: "button",
        textContent: "New token",
        on: { click: () => {
          if (confirm(`Replace the Plex token of ${user.username}? The current one stops working.`)) {
            act(() => connectPlex(user));
          }
        } },
      }),
      pairingRow(user, plex),
    ) : null,
    details,
  );
}

async function load() {
  const data = await graphql(LIST_QUERY);
  libraries = data.libraries.edges.map((edge) => edge.node);
  const users = data.users.edges.map((edge) => edge.node);
  byId("users").replaceChildren(...(users.length
    ? users.map(userCard)
    : [el("p", { className: "empty", textContent: "No users yet." })]));
  byId("signin").hidden = true;
  byId("content").hidden = false;
  byId("session").hidden = false;
}

async function start() {
  try {
    const { viewer } = await graphql(VIEWER_QUERY);
    if (!viewer.user) { showSignIn("Sign in with an owner's account."); return; }
    byId("whoami").textContent = `Signed in as ${viewer.user.username}`;
    if (viewer.role !== "OWNER") {
      showSignIn(`${viewer.user.username} is not an owner of this server.`);
      byId("session").hidden = false;
      return;
    }
    await load();
  } catch (error) {
    showSignIn(error.message);
  }
}

byId("signin").addEventListener("submit", async (event) => {
  event.preventDefault();
  say("");
  try {
    await mutate(SIGN_IN, {
      login: byId("signin-login").value.trim(),
      password: byId("signin-password").value,
    }, "signIn");
    byId("signin-password").value = "";
    await start();
  } catch (error) {
    say(error.message);
  }
});

byId("signout").addEventListener("click", async () => {
  await graphql(SIGN_OUT).catch(() => {});
  showSignIn("Signed out.");
});

byId("add").addEventListener("submit", (event) => {
  event.preventDefault();
  const username = byId("username").value.trim();
  const email = byId("email").value.trim();
  act(async () => {
    await mutate(CREATE_USER, { username, email: email || null }, "createUser");
    byId("username").value = "";
    byId("email").value = "";
  });
});

byId("pair-cancel").addEventListener("click", () => byId("pair").close());

byId("pair-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const submit = byId("pair-submit");
  submit.disabled = true;
  byId("pair-error").textContent = "";
  try {
    await graphql(PAIR_PLEX, { input: {
      userId: pairing.id,
      extension: "PLEX",
      code: byId("pair-code").value.trim(),
      connectionUri: byId("pair-address").value.trim(),
    } });
    byId("pair").close();
    await load();
  } catch (error) {
    byId("pair-error").textContent = error.message;
  } finally {
    submit.disabled = false;
  }
});

byId("credentials-copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(byId("credentials-token").value);
    byId("credentials-copy").textContent = "Copied";
  } catch {
    byId("credentials-token").select();
  }
});

byId("credentials-close").addEventListener("click", () => {
  byId("credentials-token").value = "";
  byId("credentials").close();
});

start();
</script>
</body>
</html>
